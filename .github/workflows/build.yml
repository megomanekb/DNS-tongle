name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Unzip project
        run: unzip -q ./*.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: DnsToggle
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v6
        with:
          name: DnsToggle-debug-apk
          path: DnsToggle/app/build/outputs/apk/debug/app-debug.apk
